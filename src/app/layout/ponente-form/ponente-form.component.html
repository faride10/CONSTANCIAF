<div mat-dialog-title style="margin: 0; padding: 20px 25px; background-color: #f8f9fa; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center;">
  <h2 style="margin: 0; font-size: 1.4rem; color: #1a237e; font-weight: 500;">
    {{ isEditMode ? 'Editar Ponente' : 'Nuevo Ponente' }}
  </h2>
  <button mat-icon-button (click)="onCancel()" style="color: #666;">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="mat-typography" style="min-width: 600px; padding: 25px !important; max-height: 80vh;">
  <form [formGroup]="ponenteForm">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

      <mat-form-field appearance="outline" style="grid-column: 1 / -1; width: 100%;">
        <mat-label>Nombre Completo</mat-label>
        <mat-icon matPrefix style="color: #757575; margin-right: 8px;">person</mat-icon>
        <input matInput formControlName="nombre" required placeholder="Ej. Juan Pérez">
        <mat-error *ngIf="ponenteForm.get('nombre')?.hasError('required')">Requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Título Profesional</mat-label>
        <mat-icon matPrefix style="color: #757575; margin-right: 8px;">school</mat-icon>
        <input matInput formControlName="titulo" placeholder="Ej. Ing. Sistemas">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Cargo</mat-label>
        <mat-icon matPrefix style="color: #757575; margin-right: 8px;">work</mat-icon>
        <input matInput formControlName="cargo" placeholder="Ej. Gerente">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Empresa / Institución</mat-label>
        <mat-icon matPrefix style="color: #757575; margin-right: 8px;">business</mat-icon>
        <input matInput formControlName="empresa" placeholder="Ej. Google">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Correo Electrónico</mat-label>
        <mat-icon matPrefix style="color: #757575; margin-right: 8px;">email</mat-icon>
        <input matInput type="email" formControlName="correo" placeholder="correo@ejemplo.com">
        <mat-error *ngIf="ponenteForm.get('correo')?.hasError('email')">Inválido.</mat-error>
      </mat-form-field>

    </div>

    <div *ngIf="errorMessage" style="margin-top: 10px; color: #d32f2f; background-color: #ffebee; padding: 10px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; justify-content: center;">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px; margin-right: 5px;">error</mat-icon>
      {{ errorMessage }}
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" style="padding: 15px 25px; border-top: 1px solid #e0e0e0; background-color: #fafafa; margin-bottom: 0;">
  <button mat-button (click)="onCancel()" style="color: #666; font-weight: 500;">CANCELAR</button>
  <button mat-flat-button color="primary" (click)="onSave()" 
          [disabled]="ponenteForm.invalid"
          style="background-color: #3f51b5; color: white; margin-left: 10px; padding: 0 25px;">
    GUARDAR
  </button>
</mat-dialog-actions>
