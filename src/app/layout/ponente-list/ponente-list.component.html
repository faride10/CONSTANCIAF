<div class="ponente-list-container" style="max-width: 1200px; width: 95%; margin: 0 auto; padding-top: 10px; font-family: Roboto, sans-serif;">

  <div class="header-section" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    
    <h1 class="page-title" style="color: #1a237e; font-size: 1.8rem; font-weight: 500; margin: 0; line-height: 1;">
      GESTIÓN DE PONENTES
    </h1>
    
    <button mat-flat-button color="primary" (click)="openPonenteForm()" 
            style="background-color: #3f51b5; color: white; height: 45px; padding: 0 20px; border-radius: 5px;">
      <mat-icon style="margin-right: 5px;">add</mat-icon>
      Nuevo Ponente
    </button>
  
  </div>

  <div style="background-color: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">

   <div class="search-container" style="margin-bottom: 10px;"> 
<mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field" style="width: 100%; max-width: 400px; font-size: 14px;">
    <mat-label>Buscar Ponente</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Nombre, Empresa..." #input>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-container" style="overflow-x: auto; border-radius: 4px;">
      
      <div *ngIf="isLoading" class="loading-container" style="display: flex; justify-content: center; padding: 40px;">
        <mat-spinner diameter="50"></mat-spinner>
      </div>

      <div *ngIf="errorMessage && !isLoading" class="error-message" style="background-color: #ffebee; color: #c62828; padding: 15px; margin-bottom: 15px; border-radius: 4px; text-align: center;">
        {{ errorMessage }}
      </div>

      <table mat-table [dataSource]="dataSource" matSort *ngIf="!isLoading && !errorMessage" class="w-full" style="width: 100%; border-collapse: collapse;">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px;"> NOMBRE </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; color: #333; font-weight: 500; text-transform: capitalize;"> 
            {{ row.nombre }} 
          </td>
        </ng-container>

        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px;"> TÍTULO </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; color: #666; text-transform: capitalize;"> {{ row.titulo }} </td>
        </ng-container>

        <ng-container matColumnDef="cargo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px;"> CARGO </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; color: #666; text-transform: capitalize;"> {{ row.cargo }} </td>
        </ng-container>

        <ng-container matColumnDef="empresa">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px;"> EMPRESA </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px;"> 
            <span style="background-color: #e8eaf6; color: #3f51b5; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase;">
              {{ row.empresa }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="correo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px;"> CORREO </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; color: #1565c0; font-size: 13px;"> {{ row.correo }} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-center" style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px; text-align: center;"> ACCIONES </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; text-align: center;">
            <button mat-icon-button color="primary" (click)="openPonenteForm(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletePonente(row)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="border-bottom: 1px solid #f0f0f0;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center p-4" [attr.colspan]="displayedColumns.length" style="padding: 40px; text-align: center; color: #888; font-style: italic;">
            <mat-icon style="font-size: 40px; width: 40px; height: 40px; margin-bottom: 10px; color: #e0e0e0;">search_off</mat-icon>
            <p>No se encontraron ponentes con el filtro "{{input.value}}"</p>
          </td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página" style="background: transparent; margin-top: 10px;"></mat-paginator>
      
    </div>
  </div>
</div>
