<div class="list-container" style="max-width: 1200px; width: 95%; margin: 0 auto; padding-top: 10px; font-family: Roboto, sans-serif;">

  <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h1 style="color: #1a237e; font-size: 1.8rem; font-weight: 500; margin: 0; line-height: 1;">
      GESTIÓN DE GRUPOS
    </h1>
    <button mat-flat-button color="primary" (click)="abrirModal()" 
            style="background-color: #3f51b5; color: white; height: 45px; padding: 0 20px; border-radius: 5px;">
      <mat-icon style="margin-right: 5px;">add</mat-icon>
      Nuevo Grupo
    </button>
  </div>

  <div style="background-color: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">

    <div style="margin-bottom: 5px;">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" style="width: 100%; max-width: 400px; font-size: 14px;">
        <mat-label>Buscar Grupo</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. 5E, 7A..." #input>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-container" style="overflow-x: auto; border-radius: 4px; margin-top: 15px;">
      
      <table mat-table [dataSource]="dataSource" style="width: 100%; border-collapse: collapse;">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px; width: 20%;"> GRUPO </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; font-weight: 500; color: #333;"> 
            {{row.nombre}} 
          </td>
        </ng-container>

        <ng-container matColumnDef="carrera">
          <th mat-header-cell *matHeaderCellDef style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px; width: 30%;"> CARRERA </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; color: #666;"> 
            {{row.carrera}} 
          </td>
        </ng-container>

        <ng-container matColumnDef="docente">
          <th mat-header-cell *matHeaderCellDef style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px; width: 30%;"> DOCENTE A CARGO </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px;">
            <span [style.background-color]="row.docente?.nombre ? '#e3f2fd' : '#f5f5f5'"
                  [style.color]="row.docente?.nombre ? '#1565c0' : '#999'"
                  style="padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">
              {{ row.docente?.nombre || 'Sin Asignar' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef style="background-color: #f5f5f5; color: #555; font-weight: 700; padding: 16px; text-align: center; width: 20%;"> ACCIONES </th>
          <td mat-cell *matCellDef="let row" style="padding: 12px 16px; text-align: center;">
            <button mat-icon-button color="primary" (click)="abrirModal(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarGrupo(row.id_grupo, row.nombre)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="border-bottom: 1px solid #f0f0f0;"></tr>
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [colSpan]="displayedColumns.length" style="text-align: center; padding: 40px; color: #888;">
            <mat-icon style="font-size: 40px; margin-bottom: 10px; color: #e0e0e0;">search_off</mat-icon>
            <p>No se encontraron grupos.</p>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Seleccionar página de grupos">
    </mat-paginator>

  </div>
</div>
